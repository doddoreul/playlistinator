<div class="modal" id="yt-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;">
  <div style="background:var(--panel);padding:20px;border-radius:8px;max-width:560px;width:92%;">
    <h3>Importer via YouTube</h3>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button onclick="ytTab('videos')" id="tab-videos">Vidéos</button>
      <button onclick="ytTab('playlist')" id="tab-playlist">Playlist</button>
    </div>
    <div id="pane-videos">
      <p class="muted">Une URL par ligne.</p>
      <textarea id="yt-urls" rows="6" style="width:100%"></textarea>
    </div>
    <div id="pane-playlist" style="display:none;">
      <p class="muted">URL d'une playlist YouTube.</p>
      <input type="url" id="yt-pl-url" style="width:100%" placeholder="https://www.youtube.com/playlist?list=...">
    </div>
    <div id="yt-status" class="muted" style="margin:8px 0;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
      <button onclick="closeYtModal()">Fermer</button>
      <button onclick="startYtImport()">Importer</button>
    </div>
  </div>
</div>
<script>
let ytMode='videos';
function ytTab(mode){
  ytMode=mode;
  document.getElementById('pane-videos').style.display = mode==='videos'?'block':'none';
  document.getElementById('pane-playlist').style.display = mode==='playlist'?'block':'none';
}
function closeYtModal(){ document.getElementById('yt-modal').remove(); }
async function startYtImport(){
  const status = document.getElementById('yt-status');
  let urls='';
  if(ytMode==='videos'){ urls=document.getElementById('yt-urls').value.trim(); }
  else { urls=document.getElementById('yt-pl-url').value.trim(); }
  if(!urls){ status.textContent='Aucune URL'; return; }
  status.textContent='Démarrage...';
  const fd = new FormData(); fd.append('mode', ytMode==='playlist'?'playlist':'videos'); fd.append('urls', urls);
  const r = await fetch('/plugins/youtube/import', {method:'POST', body:fd});
  const data = await r.json();
  if(data.error){ status.textContent='Erreur: '+data.error; return; }
  const jid = data.job_id;
  const poll = setInterval(async ()=>{
    const sr = await fetch('/plugins/youtube/status/'+jid);
    const j = await sr.json();
    status.textContent = j.status + (j.total? ` (${j.current}/${j.total})` : '');
    if(j.done){ clearInterval(poll); htmx.trigger('#main-content','load'); }
  }, 800);
}
</script>
