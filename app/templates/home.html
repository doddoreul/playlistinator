{% extends "base.html" %}
{% block title %}Home - Playlistinator{% endblock %}
{% block content %}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
  <div style="text-align:center;">
    <img id="home-cover" src="/static/img/placeholder.svg" alt="" style="width:100%;max-width:360px;border:2px solid var(--border);">
    <h2 id="home-title" style="margin-top:12px;">—</h2>
    <p id="home-artist" class="muted"></p>
    <p id="home-album" class="muted"></p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
      <button onclick="prevTrack()">⏮</button>
      <button onclick="togglePlay()" id="home-play-btn">▶</button>
      <button onclick="nextTrack()">⏭</button>
    </div>
    <div style="margin-top:12px;">
      <input type="range" id="home-progress" min="0" max="1000" value="0" oninput="seek(this.value)" style="width:100%;">
      <span id="home-time" class="muted">0:00</span>
    </div>
  </div>
  <div>
    <h3>Queue</h3>
    <ol id="home-queue" style="list-style:decimal;padding-left:20px;"></ol>
    <p id="home-queue-empty" class="muted">Queue is empty.</p>
  </div>
</div>
{% endblock %}
