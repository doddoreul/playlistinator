<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Playlistinator{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="banner"><span class="banner-track" id="banner-text">Playlistinator — Now playing: — , Next: —</span></div>
<div class="layout">
  <aside class="sidebar">
    <h1>Playlistinator</h1>
    <nav>
      <a href="/home" hx-boost="true">Home</a>
      <a href="/" hx-boost="true">Library</a>
      <a href="/playlists" hx-boost="true">Playlists</a>
      <a href="/gestion" hx-boost="true">Management</a>
      <a href="/plugins" hx-boost="true">Plugins</a>
    </nav>
    <div class="playlists-header"><span>Playlists</span></div>
    <div id="playlists" hx-get="/api/playlists" hx-trigger="load" hx-swap="innerHTML"></div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<div class="player-bar" id="player-bar">
  <img id="player-cover" src="/static/img/placeholder.svg" alt="">
  <div class="player-meta">
    <div id="player-title">—</div>
    <div id="player-artist" class="muted"></div>
  </div>
  <div class="player-controls">
    <button onclick="prevTrack()">⏮</button>
    <button onclick="togglePlay()" id="play-btn">▶</button>
    <button onclick="nextTrack()">⏭</button>
  </div>
  <input type="range" id="progress" min="0" max="1000" value="0" oninput="seek(this.value)">
  <span id="time" class="muted">0:00</span>
  <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)">
</div>
<audio id="audio" preload="metadata"></audio>
<script src="/static/js/player.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
