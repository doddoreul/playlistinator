{% extends "base.html" %}
{% block title %}Bibliothèque - Playlistinator{% endblock %}
{% block content %}
    <div class="toolbar">
      <input type="search" id="search" placeholder="Rechercher..." oninput="searchTracks(this.value)">
      <button onclick="scanLibrary()">Scanner</button>
    </div>
    <div id="modal-container"></div>
    <div id="main-content" hx-get="/api/tracks" hx-trigger="load" hx-swap="innerHTML"></div>
    <aside id="details-panel" class="details-panel">
      <button class="details-close" onclick="closeDetails()">✕</button>
      <div id="details-content"></div>
    </aside>
{% endblock %}
