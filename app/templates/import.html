{% extends "base.html" %}
{% block title %}Importer - Playlistinator{% endblock %}
{% block content %}
<div class="container">
  <h2>Importer une musique</h2>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
    <button class="tab active" onclick="importTab('direct')">URL directe</button>
    {% for t in import_tabs %}
    <button class="tab" onclick="importTab('{{ t.id }}')">{{ t.label }}</button>
    {% endfor %}
  </div>
  <div id="tab-direct" class="import-tab">
    <p class="muted">URL directe vers un fichier audio (.mp3).</p>
    <form id="import-form">
      <input type="url" id="import-url" placeholder="https://exemple.com/titre.mp3" required style="width:100%">
      <button type="submit">Importer</button>
    </form>
    <div id="import-status"></div>
  </div>
  {% for t in import_tabs %}
  <div id="tab-{{ t.id }}" class="import-tab" style="display:none;" hx-get="{{ t.content_url }}" hx-trigger="load" hx-swap="innerHTML"></div>
  {% endfor %}
</div>
<script src="/static/js/import.js"></script>
<script>
function importTab(name){
  document.querySelectorAll('.import-tab').forEach(d=>d.style.display='none');
  const el=document.getElementById('tab-'+name);
  if(el) el.style.display='block';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(event && event.target) event.target.classList.add('active');
}
</script>
{% endblock %}
