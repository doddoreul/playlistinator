{% extends "base.html" %}
{% block title %}Importer - Playlistinator{% endblock %}
{% block content %}
<div class="container">
  <h2>Importer une musique</h2>
  <p class="muted">URL directe vers un fichier audio (.mp3).</p>
  <form id="import-form">
    <input type="url" id="import-url" placeholder="https://exemple.com/titre.mp3" required style="width:100%">
    <button type="submit">Importer</button>
  </form>
  <div id="import-status"></div>
</div>
<script src="/static/js/import.js"></script>
{% endblock %}
