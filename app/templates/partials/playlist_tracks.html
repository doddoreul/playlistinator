{% if not tracks %}
<p class="muted">Playlist vide.</p>
{% else %}
<table class="tracks">
  <thead><tr><th>Titre</th><th>Artiste</th><th>Album</th><th>Durée</th><th></th></tr></thead>
  <tbody>
  {% for t in tracks %}
  <tr data-track-id="{{ t.id }}" data-title="{{ t.title or t.path }}" data-artist="{{ t.artist or '' }}">
    <td>{{ t.title or t.path }}</td>
    <td>{{ t.artist or '—' }}</td>
    <td>{{ t.album or '—' }}</td>
    <td>{{ (t.duration|int//60) if t.duration else '—' }}:{{ '%02d'|format(t.duration|int%60) if t.duration else '' }}</td>
    <td>
      <button onclick="event.stopPropagation(); playTrack({{ t.id }})">▶</button>
      <button onclick="event.stopPropagation(); enqueueTrack({{ t.id }})">+ file</button>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
<button onclick="playPlaylist({{ playlist_id }})" style="margin-top:8px;">Lire la playlist</button>
{% endif %}
