{% if not tracks %}
<p class="muted">Aucune piste.</p>
{% else %}
<table class="tracks">
  <thead><tr><th>Titre</th><th>Artiste</th><th>Album</th><th>Durée</th><th></th></tr></thead>
  <tbody>
  {% for t in tracks %}
  <tr data-track-id="{{ t.id }}" draggable="true">
    <td>{{ t.title or t.path }}</td>
    <td>{{ t.artist or '—' }}</td>
    <td>{{ t.album or '—' }}</td>
    <td>{{ (t.duration|int//60) if t.duration else '—' }}:{{ '%02d'|format(t.duration|int%60) if t.duration else '' }}</td>
    <td>
      <button onclick="playTrack({{ t.id }})">▶</button>
      <button onclick="editTrack({{ t.id }})">Éditer</button>
      <button onclick="searchCovers({{ t.id }})">Pochette</button>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
